services:
  raqifluz:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:20249:20249"
    environment:
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in your environment or .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set a long random SESSION_SECRET in your environment or .env}
      PUBLIC_PAIRING: ${PUBLIC_PAIRING:-0}
      PERSIST_GITHUB_REPO: ${PERSIST_GITHUB_REPO:-}
      PERSIST_GITHUB_TOKEN: ${PERSIST_GITHUB_TOKEN:-}
      PERSIST_GITHUB_BRANCH: ${PERSIST_GITHUB_BRANCH:-bot-state}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - bot-data:/app/data
      - bot-sessions:/app/sessions
      - bot-media:/app/media
      - bot-backups:/app/backups
      - bot-logs:/app/logs
volumes:
  bot-data:
  bot-sessions:
  bot-media:
  bot-backups:
  bot-logs:
